name: Fleet Mix
# Seat 5 (audio engineer) — renders the Fudai Wall mix ON THE FLEET
# (owner's standing condition: no audio/render processing on the desk VM).
# Design: MIX_CUE_SHEET.md + MIX_EXEC_PREP.md; law: RULES.md §8.
on:
  workflow_dispatch:
    inputs:
      project: { description: Project name, required: true, default: fudai-wall-v2, type: string }
      bed_trim_db: { description: Bed gain trim dB (lower the bed if voice-to-bed ratio misses; never touch the voice), required: false, default: '0', type: string }
      sfx_trim_db: { description: SFX bus trim dB, required: false, default: '0', type: string }
jobs:
  mix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/unified-interface
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | head -1; else
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render mix and measure (RULES §8 gates inside the script)
        env:
          PROJECT_NAME: ${{ inputs.project }}
          BED_TRIM_DB: ${{ inputs.bed_trim_db }}
          SFX_TRIM_DB: ${{ inputs.sfx_trim_db }}
        run: |
          set -o pipefail
          chmod +x fleet/mix_fudai.sh
          fleet/mix_fudai.sh "projects/${PROJECT_NAME}" mix-output 2>&1 | tee mix-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-mix-${{ inputs.project }}-${{ github.run_id }}
          path: |
            mix-output/fudai_wall_mix_48k.wav
            mix-output/mix_report.json
            mix-output.log
          if-no-files-found: warn
          retention-days: 30
