name: Fleet Render Chunk

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name under projects/"
        required: true
        default: "demo-ring"
        type: string
      spec:
        description: "Mode spec: render:START:END or track:START:END"
        required: true
        default: "render:0:30"
        type: string
      settings:
        description: "Effective project settings JSON"
        required: false
        default: '{}'
        type: string

jobs:
  render-chunk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system deps
        run: npx playwright install --with-deps chromium

      - name: Render chunk
        env:
          FLEET_PROJECT: projects/${{ inputs.project }}
          FLEET_SETTINGS: ${{ inputs.settings }}
        run: npx tsx fleet/render-chunk.ts --frame "${{ inputs.spec }}" --out fleet-result.tar.gz

      - name: Upload chunk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-chunk-${{ inputs.project }}-${{ github.run_id }}
          path: fleet-result.tar.gz
          retention-days: 30
